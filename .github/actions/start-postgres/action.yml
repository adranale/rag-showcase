name: Start PostgreSQL if stopped
description: Starts pg-rag-<suffix> when auto-stop has stopped it and waits until it is Ready. Needs a prior Azure login.

inputs:
  suffix:
    description: Deployment suffix
    required: true
  resource-group:
    description: Resource group of the deployment
    required: true
  subscription-id:
    description: Azure subscription ID
    required: true

runs:
  using: composite
  steps:
    - name: Start the PostgreSQL server if it is stopped
      shell: pwsh
      env:
        SUFFIX: ${{ inputs.suffix }}
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
      run: |
        $server = "pg-rag-$env:SUFFIX"
        $state = az postgres flexible-server show --resource-group $env:RESOURCE_GROUP `
          --name $server --subscription $env:SUBSCRIPTION_ID --query state --output tsv
        if ($LASTEXITCODE -ne 0 -or -not $state) { throw "Could not read the state of $server." }
        if ($state -eq 'Stopped') {
          az postgres flexible-server start --resource-group $env:RESOURCE_GROUP `
            --name $server --subscription $env:SUBSCRIPTION_ID --output none
          if ($LASTEXITCODE -ne 0) { throw "Could not start $server." }
        }
        $state = az postgres flexible-server show --resource-group $env:RESOURCE_GROUP `
          --name $server --subscription $env:SUBSCRIPTION_ID --query state --output tsv
        if ($state -ne 'Ready') { throw "The PostgreSQL server is '$state', not 'Ready'." }
