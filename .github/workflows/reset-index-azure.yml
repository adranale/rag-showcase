name: Reset index (Azure)

# DESTRUCTIVE. Manual trigger. Deletes ALL documents, chunks, embeddings and remote
# source connections in the Azure database (the schema stays). Afterwards run
# "Ingest sample data (Azure)" and/or "Azure ingestion job" to index again.
# Type RESET in the confirm input. A temporary firewall rule for this runner's IP is
# added and always removed again; the connection string comes from the rag-api secret.
on:
  push:
    branches: [feature/storage-connectors]
    paths: [.github/workflows/reset-index-azure.yml]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESET to delete all indexed data
        required: true
        type: string
      suffix:
        description: Suffix used for the deployment (server pg-rag-<suffix>)
        required: true
        type: string
      resource_group:
        description: Resource group of the deployment
        default: rg-rag-showcase
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  reset:
    if: ${{ inputs.confirm == 'RESET' }}
    runs-on: ubuntu-latest
    environment: azure-test
    env:
      SUFFIX: ${{ inputs.suffix }}
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open firewall for this runner
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod https://api.ipify.org).ToString().Trim()
          if ($ip -notmatch '^(\d{1,3}\.){3}\d{1,3}$') { throw 'Could not determine the runner IP.' }
          $server = "pg-rag-$env:SUFFIX"
          az postgres flexible-server firewall-rule create `
            --resource-group $env:RESOURCE_GROUP --server-name $server `
            --name allow-ci-reset --start-ip-address $ip --end-ip-address $ip `
            --subscription $env:SUBSCRIPTION_ID --output none
          if ($LASTEXITCODE -ne 0) {
            # older Azure CLI argument names
            az postgres flexible-server firewall-rule create `
              --resource-group $env:RESOURCE_GROUP --name $server `
              --rule-name allow-ci-reset --start-ip-address $ip --end-ip-address $ip `
              --subscription $env:SUBSCRIPTION_ID --output none
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the firewall rule.' }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Reset the index
        shell: pwsh
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true | Out-Null
          $state = az postgres flexible-server show --resource-group $env:RESOURCE_GROUP `
            --name "pg-rag-$env:SUFFIX" --subscription $env:SUBSCRIPTION_ID --query state --output tsv
          if ($state -ne 'Ready') { throw "The PostgreSQL server is '$state'; start it first (it stops itself when idle)." }
          $url = az containerapp secret show --resource-group $env:RESOURCE_GROUP --name rag-api `
            --secret-name db-url --subscription $env:SUBSCRIPTION_ID --query value --output tsv
          if ($LASTEXITCODE -ne 0 -or $url -notmatch '^postgres(ql)?://') { throw 'Could not read the db-url secret of rag-api.' }
          Write-Output "::add-mask::$url"
          $env:DATABASE_URL = $url
          $env:CONFIRM = 'RESET'
          python -m pip install -r requirements.txt
          python reset_index_db.py
          python init_db.py

      - name: Remove firewall rule
        if: ${{ always() && inputs.confirm == 'RESET' }}
        continue-on-error: true
        shell: pwsh
        run: |
          $server = "pg-rag-$env:SUFFIX"
          az postgres flexible-server firewall-rule delete `
            --resource-group $env:RESOURCE_GROUP --server-name $server `
            --name allow-ci-reset --subscription $env:SUBSCRIPTION_ID --yes
          if ($LASTEXITCODE -ne 0) {
            az postgres flexible-server firewall-rule delete `
              --resource-group $env:RESOURCE_GROUP --name $server `
              --rule-name allow-ci-reset --subscription $env:SUBSCRIPTION_ID --yes
          }
