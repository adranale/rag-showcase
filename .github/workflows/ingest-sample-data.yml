name: Ingest sample data (Azure)

# Manual trigger. Initialises the schema and ingests data/sample into the already
# deployed PostgreSQL server. The connection string is read from the rag-api app's
# "db-url" secret at run time; nothing is stored in the repo or in GitHub secrets.
# A temporary firewall rule for this runner's IP is added and always removed again.
on:
  push:
    paths: [".github/workflows/ingest-sample-data.yml"]
  workflow_dispatch:
    inputs:
      suffix:
        description: Suffix used for the deployment (server pg-rag-<suffix>)
        required: true
        type: string
      resource_group:
        description: Resource group of the deployment
        default: rg-rag-showcase
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: azure-test
    env:
      SUFFIX: ${{ inputs.suffix }}
      RESOURCE_GROUP: ${{ inputs.resource_group }}
      SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open firewall for this runner
        shell: pwsh
        run: |
          $ip = (Invoke-RestMethod https://api.ipify.org).ToString().Trim()
          if ($ip -notmatch '^(\d{1,3}\.){3}\d{1,3}$') { throw 'Could not determine the runner IP.' }
          $server = "pg-rag-$env:SUFFIX"
          az postgres flexible-server firewall-rule create `
            --resource-group $env:RESOURCE_GROUP --server-name $server `
            --name allow-ci-ingest --start-ip-address $ip --end-ip-address $ip `
            --subscription $env:SUBSCRIPTION_ID --output none
          if ($LASTEXITCODE -ne 0) {
            # older Azure CLI argument names
            az postgres flexible-server firewall-rule create `
              --resource-group $env:RESOURCE_GROUP --name $server `
              --rule-name allow-ci-ingest --start-ip-address $ip --end-ip-address $ip `
              --subscription $env:SUBSCRIPTION_ID --output none
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the firewall rule.' }
          }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Initialise database and ingest sample data
        shell: pwsh
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true | Out-Null
          $url = az containerapp secret show --resource-group $env:RESOURCE_GROUP --name rag-api `
            --secret-name db-url --subscription $env:SUBSCRIPTION_ID --query value --output tsv
          if ($LASTEXITCODE -ne 0 -or $url -notmatch '^postgres(ql)?://') { throw 'Could not read the db-url secret of rag-api.' }
          Write-Output "::add-mask::$url"
          $env:DATABASE_URL = $url
          python -m pip install -r requirements.txt
          python init_db.py
          python ingest_text.py
          python embed_chunks.py

      - name: Remove firewall rule
        if: ${{ always() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $server = "pg-rag-$env:SUFFIX"
          az postgres flexible-server firewall-rule delete `
            --resource-group $env:RESOURCE_GROUP --server-name $server `
            --name allow-ci-ingest --subscription $env:SUBSCRIPTION_ID --yes
          if ($LASTEXITCODE -ne 0) {
            az postgres flexible-server firewall-rule delete `
              --resource-group $env:RESOURCE_GROUP --name $server `
              --rule-name allow-ci-ingest --subscription $env:SUBSCRIPTION_ID --yes
          }
