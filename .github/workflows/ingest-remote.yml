name: Ingest remote documents

# Manual trigger only. Pulls TXT/MD/PDF files from Dropbox or Google Drive into the
# Azure PostgreSQL database and embeds them. Credentials come from secrets of the
# "remote-ingestion" environment (add required reviewers to approve every run).
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Document source
        required: true
        type: choice
        options:
          - dropbox
          - google_drive
      folder:
        description: Dropbox folder path (e.g. /Documents/rag) or Google Drive folder ID
        required: true
        type: string
      delete_removed:
        description: Hard-delete documents whose remote file vanished (default keeps a tombstone)
        default: false
        type: boolean
      open_firewall:
        description: Temporarily allow this runner's IP on the PostgreSQL server (needs the Azure secrets)
        default: true
        type: boolean
      suffix:
        description: Suffix used by the Azure deployment (server pg-rag-<suffix>)
        default: ""
        type: string
      resource_group:
        description: Resource group of the PostgreSQL server
        default: rg-rag-showcase
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: remote-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    environment: remote-ingestion
    env:
      PROVIDER: ${{ inputs.provider }}
      FOLDER: ${{ inputs.folder }}
      DELETE_REMOVED: ${{ inputs.delete_removed }}
      FIREWALL_RULE: allow-ci-ingest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        if: ${{ inputs.open_firewall }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow runner IP on PostgreSQL
        if: ${{ inputs.open_firewall }}
        shell: bash
        env:
          SUFFIX: ${{ inputs.suffix }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          [[ "$SUFFIX" =~ ^[a-z0-9]{3,10}$ ]] || { echo "suffix is required when open_firewall is set"; exit 1; }
          ip="$(curl -fsS https://api.ipify.org)"
          az postgres flexible-server firewall-rule create \
            --resource-group "$RESOURCE_GROUP" --name "pg-rag-$SUFFIX" \
            --rule-name "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip" \
            --subscription "$SUBSCRIPTION_ID" --output none

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: >
          python -m pip install
          --extra-index-url https://download.pytorch.org/whl/cpu
          -r requirements.txt

      - name: Ingest and embed
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          args=(--provider "$PROVIDER" --folder "$FOLDER")
          if [ "$DELETE_REMOVED" = "true" ]; then args+=(--delete-removed); fi
          python init_db.py
          python ingest_remote.py "${args[@]}"
          python embed_chunks.py

      - name: Remove runner IP from PostgreSQL firewall
        if: ${{ always() && inputs.open_firewall }}
        continue-on-error: true
        shell: bash
        env:
          SUFFIX: ${{ inputs.suffix }}
          RESOURCE_GROUP: ${{ inputs.resource_group }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RESOURCE_GROUP" --name "pg-rag-$SUFFIX" \
            --rule-name "$FIREWALL_RULE" --subscription "$SUBSCRIPTION_ID" --yes
