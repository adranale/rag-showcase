services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    image: rag-showcase:local
    environment:
      DATABASE_URL: postgresql://rag:local_dev_only@db:5432/rag
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      # Local dev only: the owner role `rag` bypasses RLS (queries still filter by user_id).
      USER_TOKEN_SECRET: ${USER_TOKEN_SECRET:?set USER_TOKEN_SECRET (32+ chars) in .env}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      DROPBOX_REDIRECT_URI: ${DROPBOX_REDIRECT_URI:-http://localhost:8501/}
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  ui:
    image: rag-showcase:local
    command: ["python", "ui/start.py"]
    environment:
      RAG_API_BASE_URL: http://api:8000
      USER_TOKEN_SECRET: ${USER_TOKEN_SECRET:?set USER_TOKEN_SECRET (32+ chars) in .env}
      AUTH_REDIRECT_URI: ${AUTH_REDIRECT_URI:-http://localhost:8501/oauth2callback}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_TENANT: ${MS_TENANT:-consumers}
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  huggingface_cache: